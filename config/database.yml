default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("PGHOST") { ENV["HOME"] + "/postgres_data" } %>
  port: <%= ENV.fetch("PGPORT") { 5434 } %>
  username: <%= ENV.fetch("PGUSER") { "gs" } %>
  password: <%= ENV["PGPASSWORD"] %>

development:
  <<: *default
  database: rails_project_development

test:
  <<: *default
  database: rails_project_test

production:
  primary:
    <<: *default
    database: rails_project_production
